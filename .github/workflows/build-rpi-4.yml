name: build-rpi-4

# This file is never triggered directly by a person. The release orchestrator
# You have to add it into the main release.yml because github is too good to allow workflow discovery.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT for linux-arm64 does NOT work out of the box on an x64
      # (ubuntu-latest) runner - dotnet publish needs an actual cross linker
      # and target-architecture zlib to produce the native binary. Without
      # this step the publish below fails at the native compile/link stage.
      # Sequence follows Microsoft's documented cross-compile steps:
      # https://learn.microsoft.com/dotnet/core/deploying/native-aot/cross-compile
      - name: Install ARM64 cross-compilation toolchain
        run: |
          set -euo pipefail

          UBUNTU_CODENAME=$(lsb_release -cs)

          # Remove all existing list files to avoid mixed architectures
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.list

          # Create deb822 sources for amd64 (normal repos)
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: ${UBUNTU_CODENAME} ${UBUNTU_CODENAME}-updates ${UBUNTU_CODENAME}-backports
          Components: main restricted universe multiverse
          Architectures: amd64

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: ${UBUNTU_CODENAME}-security
          Components: main restricted universe multiverse
          Architectures: amd64
          EOF

          # Create deb822 sources for arm64 (ports repos)
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${UBUNTU_CODENAME} ${UBUNTU_CODENAME}-updates ${UBUNTU_CODENAME}-backports ${UBUNTU_CODENAME}-security
          Components: main restricted universe multiverse
          Architectures: arm64
          EOF

          # Enable arm64 architecture
          sudo dpkg --add-architecture arm64

          # Update + install cross‑compile toolchain
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            zlib1g-dev:arm64

      - name: Restore
        run: dotnet restore

      # NOTE: Pi 3 and Pi 4 both map to the .NET RID "linux-arm64" - there is
      # currently no separate RID between them, so this build is identical to
      # build-rpi-3.yml. Kept as a separate file so you have a natural seam
      # if you ever need Pi-4-specific publish flags or drivers.
      - name: Publish AOT (linux-arm64 / Raspberry Pi 4)
        run: >
          dotnet publish
          -c Release
          -r linux-arm64
          -p:Version=${{ inputs.version }}
          -p:PublishAot=true
          -p:StripSymbols=true
          -p:DebuggerSupport=false
          -p:StackTraceSupport=false
          -p:InvariantGlobalization=true
          -p:IlcUseLLVM=true
          -p:IlcInstructionSet="armv8-a crc crypto"
          --self-contained true
          -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prx-camera-rpi-4-${{ inputs.version }}
          path: publish/Prx.Camera
          if-no-files-found: error
