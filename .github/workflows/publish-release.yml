name: publish-release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Native artifact download - pulls all artifacts matching the pattern
      # and merges them flatly into the /release directory.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prx-camera-*
          path: release
          merge-multiple: false

      - name: Rename and Generate checksums
        run: |
          set -euo pipefail
          cd release
          # 1. Find all Prx.Camera files in subdirectories
          # 2. Extract the platform name from the parent directory
          # 3. Move and rename the file
          find . -name "Prx.Camera" | while read -r filepath; do
            # Extract platform (e.g., 'prx-camera-linux-x64-0.0.2')
            parent_dir=$(dirname "$filepath" | cut -d/ -f2)
          
            # Remove the 'prx-camera-' prefix and the '-version' suffix
            # Resulting format: linux-x64, rpi-3, or rpi-4
            platform=$(echo "$parent_dir" | sed -E 's/prx-camera-(.*)-[0-9]+\.[0-9]+\.[0-9]+/\1/')
          
            # Move and rename
            mv "$filepath" "./Prx.Camera-$platform"
          done
          
          # 4. Generate checksums for all renamed files
          for f in Prx.Camera-*; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Release ${{ inputs.version }}"
          files: release/*
          generate_release_notes: true