name: release

# Human-triggered only. Run this from the Actions tab, picking the release
# tag as the ref (not a branch) - the tag itself is the only source of truth
# for the version. The validate job checks it's actually a tag, checks it's
# valid semver, and checks a release for it doesn't already exist.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate tag and semver
        id: validate
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow must be run from a tag, not a branch. Pick a tag as the ref when dispatching."
            exit 1
          fi

          TAG="${{ github.ref_name }}"

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9](-\w*)?+$ ]]; then
            echo "::error::Tag '${TAG}' is not valid semver (expected e.g. 1.2.3, no leading 'v')."
            exit 1
          fi

          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      # Prevents accidentally re-releasing/overwriting a version that's
      # already been published - softprops/action-gh-release would otherwise
      # silently update an existing release for this tag instead of failing.
      - name: Ensure no release already exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.validate.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A release already exists for tag '${TAG}'. Delete it first if this is intentional, or cut a new tag/version."
            exit 1
          fi
          echo "No existing release for ${TAG} - proceeding."

  build-linux-x64:
    needs: validate
    uses: ./.github/workflows/build-linux-x64.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  build-rpi-3:
    needs: validate
    uses: ./.github/workflows/build-rpi-3.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  build-rpi-4:
    needs: validate
    uses: ./.github/workflows/build-rpi-4.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build-linux-x64, build-rpi-3, build-rpi-4]
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
